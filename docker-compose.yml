services:
  audio-lab:
    build: .
    container_name: audio-lab
    restart: unless-stopped

    user: "1000:1000"

    environment:
      AUDIO_ROOT: /remote/Audio
      CORE_URL: http://ai-gateway:8080
      MAX_UPLOAD_MB: 2048
      LIVE_SESSIONS_ROOT: /remote/Audio/sessions
      KNOWLEDGE_REGISTRY_PATH: /remote/Audio/knowledge/registry.json
      MAC_CAPTURE_AGENT_URL: ${MAC_CAPTURE_AGENT_URL:-http://host.docker.internal:8011}
      MAC_CAPTURE_AGENT_TOKEN: ${MAC_CAPTURE_AGENT_TOKEN:-}
      LIVE_UPLOAD_TOKEN: ${LIVE_UPLOAD_TOKEN:-}
      AUDIO_LAB_PUBLIC_URL: ${AUDIO_LAB_PUBLIC_URL:-http://127.0.0.1:3011}
      LIVE_CHUNK_SILENCE_SECONDS: ${LIVE_CHUNK_SILENCE_SECONDS:-5}
      LIVE_CHUNK_MIN_SECONDS: ${LIVE_CHUNK_MIN_SECONDS:-20}
      LIVE_CHUNK_MAX_SECONDS: ${LIVE_CHUNK_MAX_SECONDS:-600}
      LIVE_POLL_INTERVAL_SECONDS: ${LIVE_POLL_INTERVAL_SECONDS:-2}

    ports:
      - "3011:8080"

    volumes:
      - /home/homelabuser/RemoteDrop/Audio:/remote/Audio

    networks:
      - ai-network

networks:
  ai-network:
    external: true
